[package]
name = "cosmic-bg-config"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.27"
egui_extras = { version = "0.27", features = ["image"] }
gstreamer = "0.23"
gstreamer-app = "0.23"
gstreamer-video = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.14"
tray-item = { version = "0.9.0", features = ["libappindicator"] }
crossbeam-channel = "0.5"
cosmic-bg-core = { path = "../cosmic-bg-core" }
libc = "0.2"
dirs = "5.0"

[package.metadata.deb]
maintainer = "Your Name <your.email@example.com>"
copyright = "2024, Your Name"
depends = "libgstreamer1.0-0, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-libav, libxkbcommon0, libappindicator3-1"
assets = [
    ["../target/release/cosmic-bg-config", "/usr/bin/", "755"],
    ["../target/release/cosmic-bg-core", "/usr/bin/", "755"],
    ["../cosmic-bg-video.svg", "/usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../packaging/cosmic-bg-config.desktop", "/usr/share/applications/", "644"],
    ["../packaging/cosmic-bg-video.service", "/usr/lib/systemd/user/", "644"],
]